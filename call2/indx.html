<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>

    <style>
        :root{
          --ui-left: 50%;
          --ui-width: 78%;
          --slider-h: 86px;

          --pad: 3px;
          --slider-bottom: clamp(90px, 14%, 160px);
          --quick-gap: 48px;
          --knob: calc(var(--slider-h) - var(--pad)*2);

          --radius: 52px;
          --ios-red: #FF453A;
          --soft-white: rgba(255,255,255,.95);

          /* ===== Status bar pixel tuning ===== */
          --sb-top: 28px;
          --sb-pad-x: 30px;
          --sb-gap: 6px;

          --sig-w: 24px;
          --sig-h: 12px;
          --sig-scale: 1;
          --sig-y: 0px;

          --wifi-w: 19px;
          --wifi-h: 12px;
          --wifi-scale: 1;
          --wifi-y: 0px;

          --bat-w: 28px;
          --bat-h: 12px;
          --bat-scale: 1;
          --bat-y: 0px;

          /* ===== answered actions ===== */
          --ans-size: var(--knob);
          --ans-label-gap: 10px;
        }

        *{ box-sizing:border-box; }

        html, body{
          width:100%;
          height:100%;
          margin:0;
        }
        body{
          min-height:100vh;
          display:grid;
          place-items:center;
          background:#111;
          overflow:hidden;
        }

        .end-mask{
          position:absolute;
          inset:0;
          background: radial-gradient(120% 80% at 50% 0%, rgba(0,0,0,0.2), transparent 60%), rgba(0,0,0,0.8);
          opacity:0;
          pointer-events:none;
          transition: opacity .35s ease;
          z-index: 999;
        }

        .phone-card.ended .end-mask{
          opacity:1;
          pointer-events:auto;
        }

        .phone-card.ended .call-ui{
          pointer-events:none;
        }

        .phone-card{
          position: relative;
          width: min(90vw, 390px);
          aspect-ratio: 9 / 19.5;
          overflow: hidden;
          border-radius: var(--radius);
          background:#000;
        }

        .avatar{
          position:absolute; inset:0;
          width:100%; height:100%;
          object-fit: cover;
          transform: scale(1.05);
          animation: subtleZoom 10s ease-in-out infinite;
        }

        .call-ui{
          -webkit-font-smoothing: antialiased;
          -moz-osx-font-smoothing: grayscale;
          text-rendering: optimizeLegibility;

          position:absolute; inset:0;
          text-align:center;
          font-family: system-ui, -apple-system,
            "SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;
          color: var(--soft-white);

          pointer-events:auto;

          background:
            radial-gradient(120% 80% at 50% 10%, rgba(0,0,0,.18), transparent 55%),
            radial-gradient(120% 90% at 50% 100%, rgba(0,0,0,.72), transparent 60%),
            linear-gradient(to bottom, rgba(0,0,0,.10), rgba(0,0,0,.38));
        }

        .status-bar,
        .name, .sub,
        .quick-row,
        .track,
        .hint-wrap{
          pointer-events:none;
        }

        .status-bar{
          position:absolute;
          top: var(--sb-top); left:0; right:0;
          padding: 0 var(--sb-pad-x);
          display:flex; align-items:center; justify-content:space-between;
          font-size:16px;
          font-weight:600;
          letter-spacing:.2px;
          line-height:1.2;
          color: var(--soft-white);
        }

        .status-right{
          display:flex; align-items:center;
          gap: var(--sb-gap);
          color: var(--soft-white);
        }
        .status-right svg{
          display:block;
          color: currentColor;
          filter: drop-shadow(0 1px 1px rgba(0,0,0,.25));
        }

        .sb-signal{
          width: var(--sig-w);
          height: var(--sig-h);
          transform: translateY(var(--sig-y)) scale(var(--sig-scale));
          transform-origin:center;
        }
        .sb-wifi{
          width: var(--wifi-w);
          height: var(--wifi-h);
          transform: translateY(var(--wifi-y)) scale(var(--wifi-scale));
          transform-origin:center;
        }
        .sb-battery{
          width: var(--bat-w);
          height: var(--bat-h);
          transform: translateY(var(--bat-y)) scale(var(--bat-scale));
          transform-origin:center;
        }

        .name{
          margin-top:120px;
          font-size:34px;
          font-weight:400;
          letter-spacing:0.1px;
          line-height:1.08;
          animation: fadeInUp .6s ease both;
          color: rgba(255,255,255,0.95);
          text-shadow:
            0 1px 2px rgba(0,0,0,.15),
            0 0 8px rgba(0,0,0,.18);
        }
        .sub{
          margin-top:4px;
          font-size:22px;
          font-weight:400;
          letter-spacing:-.1px;
          line-height:1.25;
          animation: fadeInUp .8s ease both;
          color: rgba(255,255,255,0.45);
          text-shadow:
            0 1px 2px rgba(0,0,0,.15),
            0 0 8px rgba(0,0,0,.18);
        }

        .quick-row{
          position:absolute;
          z-index: 6;
          left:var(--ui-left);
          bottom:calc(var(--slider-bottom) + var(--slider-h) + var(--quick-gap));
          width:var(--ui-width);
          transform:translateX(-50%);
          display:flex; justify-content:space-between;
          padding:0 9px;
          transition: opacity .25s ease, transform .25s ease;
        }
        .quick{
          display:grid; justify-items:center; gap:6px;
        }
        .quick-ico{
          width:20px; height:20px;
          color:var(--soft-white);
          filter:drop-shadow(0 0px 4px rgba(0,0,0,.2));
        }
        .quick-txt{
          font-size:16px;
          color: rgba(255,255,255,0.95);
          letter-spacing:.2px;
          text-shadow: 0 0px 4px rgba(0,0,0,.4);
        }

        .slide-bar{
          position:absolute;
          left:var(--ui-left);
          bottom:var(--slider-bottom);
          z-index: 10;
          width:var(--ui-width); height:var(--slider-h);
          transform:translateX(-50%);
          pointer-events:auto;
        }

        .track{
          position:absolute; top:0; bottom:0;
          left: var(--cx, 0px);
          width: calc(100% - var(--cx, 0px));
          border-radius:999px;
          z-index:0;
          will-change:left,width;
          background: rgba(255,255,255,.16);
          backdrop-filter: blur(4px) saturate(1.2);
          -webkit-backdrop-filter: blur(4px) saturate(1.2);
        }

        .hint-wrap{
          position:absolute; inset:var(--pad);
          display:flex; align-items:center; justify-content:center;
          z-index:1;
          clip-path: inset(
            0 0 0 calc(var(--pad) + var(--cx, 0px) + var(--pad))
          );
          will-change: clip-path;
        }

        .hint{
          position:relative;
          display:inline-block;
          font-size:20px;
          font-weight:400;
          letter-spacing:.2px;
          line-height:1.2;
          text-shadow: 0 0px 4px rgba(0,0,0,.14);
          white-space:nowrap;
          transform: translateX(30px);
        }
        .hint-base{ color: rgba(20,20,20,0.75); }
        .hint-shimmer{
          position:absolute; inset:0;
          -webkit-text-fill-color: transparent;
          -webkit-background-clip: text;
          background-clip: text;
          background-image: linear-gradient(
            90deg,
            rgba(255,255,255,0.00) 0%,
            rgba(255,255,255,0.00) 40%,
            rgba(255,255,255,0.95) 50%,
            rgba(255,255,255,0.00) 60%,
            rgba(255,255,255,0.00) 100%
          );
          background-size: 300% 100%;
          animation: hintShimmer 2.5s linear infinite;
          opacity:0.95;
        }
        @keyframes hintShimmer{
          0%{ background-position: 100% 0; }
          100%{ background-position: -10% 0; }
        }

        .knob{
          width:var(--knob);
          height:var(--knob);
          border-radius:50%;
          background:var(--soft-white);
          display:grid; place-items:center;
          transform: translateX(0);
          cursor:grab;
          pointer-events:auto;
          box-shadow:
            0 1px 2px rgba(0,0,0,.18),
            0 6px 18px rgba(0,0,0,.22);
          position:absolute;
          left: var(--pad); top: var(--pad);
          z-index:12;
          will-change: transform;
          touch-action:none;
        }
        .knob:active{ cursor:grabbing; }

        .phone-ico{
          width:30px; height:30px;
          color:var(--ios-red);
          transform: translateY(1px);
        }

        .answered-row{
          position:absolute;
          z-index: 2;
          left:var(--ui-left);
          bottom: calc(var(--slider-bottom) + var(--pad));
          transform:translateX(-50%) translateY(0px);
          display:flex;
          justify-content: space-between;
          width: var(--ui-width);
          gap: 0;
          opacity:0;
          pointer-events:none;
          transition: opacity .25s ease, transform .25s ease;
        }

        .answered-btn{
          position: relative;
          display:grid;
          justify-items:center;
          gap: 0;
          pointer-events:auto;
          user-select:none;

          font-size:16px;
          color: rgba(255,255,255,0.95);
          letter-spacing:.2px;
          text-shadow: 0 0px 4px rgba(0,0,0,.4);
          cursor:pointer;
          -webkit-tap-highlight-color: transparent;
        }

        .answered-btn > div:last-child{
          position: absolute;
          top: calc(100% + var(--ans-label-gap));
          left: var(--ui-left);
          transform: translateX(-50%);
          white-space: nowrap;
          font-size: 16px;
          line-height: 1.2;
        }

        .answered-circle{
          width:var(--ans-size);
          height:var(--ans-size);
          border-radius:50%;
          display:grid;
          place-items:center;
        }
        .answered-circle.glass{
          background: rgba(255,255,255,.16);
          backdrop-filter: blur(4px) saturate(1.2);
          -webkit-backdrop-filter: blur(4px) saturate(1.2);
        }
        .answered-circle.red{
          background: var(--ios-red);
        }

        .answered-ico{
          width:34px;
          height:34px;
          color:#fff;
          opacity:.95;
          filter: drop-shadow(0 1px 1px rgba(0,0,0,.25));
        }

        .answered .quick-row{ opacity:0; }
        .answered .slide-bar{
          opacity:0;
          pointer-events:none;
        }
        .answered .answered-row{
          z-index: 20;
          opacity:1;
          transform:translateX(-50%) translateY(0);
          pointer-events:auto;
        }

        @keyframes fadeInUp{
          from{opacity:0;transform:translateY(10px)}
          to{opacity:1;transform:translateY(0)}
        }
        @keyframes subtleZoom{
          0%,100%{transform:scale(1.05)}
          50%{transform:scale(1.10)}
        }

        @media (max-width: 768px){
          body{ display:block; background:#000; margin:0; overflow:hidden; }
          .phone-card{
            position: fixed; inset:0; width:100vw; height:100vh;
            height:100svh; height:100dvh;
            aspect-ratio:auto; border-radius:0;
          }
          .avatar{ width:100%; height:100%; object-fit:cover; }
        }
    </style>
</head>

                    <svg class="answered-ico ico-mute" viewBox="0 0 20.5737 21.9971" aria-hidden="true">
                        <path d="M14.7456 18.8456C14.6182 19.3076 14.2143 19.6167 13.6853 19.6167C13.2361 19.6167 12.8552 19.4312 12.406 19.0015L8.24586 15.0562C8.1775 14.9976 8.09937 14.9683 8.00172 14.9683L5.19898 14.9683C3.88062 14.9683 3.15797 14.2456 3.15797 12.8296L3.15797 9.1968C3.15797 8.56128 3.30556 8.06338 3.59041 7.70997ZM14.7888 3.5425L14.7888 13.5358L8.23109 6.98189C8.23614 6.97838 8.24102 6.97438 8.24586 6.97024L12.406 3.06399C12.9041 2.58547 13.2166 2.39016 13.6658 2.39016C14.3298 2.39016 14.7888 2.90774 14.7888 3.5425Z"
                              fill="currentColor" fill-opacity="0.95"/>
                        <path d="M18.158 20.6421C18.4509 20.9351 18.9294 20.9351 19.2224 20.6421C19.5056 20.3394 19.5154 19.8706 19.2224 19.5777L2.4939 2.85891C2.20093 2.56594 1.71265 2.56594 1.41968 2.85891C1.13648 3.14211 1.13648 3.64016 1.41968 3.92336Z"
                              fill="currentColor" fill-opacity="0.95"/>
                    </svg>

                    <!-- Speaker icon (默认隐藏) -->
                    <svg class="answered-ico ico-speak" viewBox="0 0 14.2578 17.2363" aria-hidden="true"
                         style="display:none">
                        <path d="M10.5273 17.2363C11.1719 17.2363 11.6309 16.7773 11.6309 16.1426L11.6309 1.16211C11.6309 0.527344 11.1719 0.00976562 10.5078 0.00976562C10.0586 0.00976562 9.74609 0.205078 9.24805 0.683594L5.08789 4.58984C5.01953 4.64844 4.94141 4.67773 4.84375 4.67773L2.04102 4.67773C0.722656 4.67773 0 5.41016 0 6.81641L0 10.4492C0 11.8652 0.722656 12.5879 2.04102 12.5879L4.84375 12.5879C4.94141 12.5879 5.01953 12.6172 5.08789 12.6758L9.24805 16.6211C9.69727 17.0508 10.0781 17.2363 10.5273 17.2363Z"
                              fill="currentColor" fill-opacity="0.95"/>
                    </svg>
                </div>
                <div class="label-mute">Mute</div>
            </div>

            <div class="answered-btn" id="btnEnd" role="button" aria-label="End">
                <div class="answered-circle red">
                    <svg class="answered-ico" viewBox="0 0 23.4375 8.38867" aria-hidden="true">
                        <path d="M11.5332 0C7.73438 0 3.4082 0.683594 1.29883 2.86133C0.488281 3.68164 0 4.70703 0 6.00586C0 6.89453 0.283203 8.21289 1.31836 8.31055C1.60156 8.38867 1.875 8.35938 2.22656 8.30078L5.10742 7.82227C6.10352 7.65625 6.57227 7.28516 6.83594 6.32812L7.31445 4.60938C7.41211 4.25781 7.50977 4.14062 7.92969 3.98438C8.71094 3.70117 10 3.54492 11.5332 3.54492C13.0762 3.54492 14.3652 3.70117 15.1465 3.98438C15.5664 4.14062 15.6641 4.25781 15.752 4.60938L16.2402 6.32812C16.5039 7.28516 16.9727 7.65625 17.9688 7.82227L20.8496 8.30078C21.1914 8.35938 21.4648 8.38867 21.748 8.31055C22.793 8.21289 23.0762 6.89453 23.0762 6.00586C23.0762 4.70703 22.5879 3.68164 21.7773 2.86133C19.668 0.683594 15.3418 0 11.5332 0Z"
                              fill="currentColor" fill-opacity="0.95"/>
                    </svg>
                </div>
                <div>End</div>
            </div>

            <div class="answered-btn" id="btnPause" role="button" aria-label="Pause">
                <div class="answered-circle glass">
                    <svg class="answered-ico ico-pause" viewBox="0 0 11.914 16.1582" aria-hidden="true">
                        <path d="M1.30489 16.1458L3.52445 16.1458C4.3731 16.1458 4.81898 15.6999 4.81898 14.8409L4.81898 1.3049C4.81898 0.404486 4.3731-1.77636e-15 3.52445-1.77636e-15L1.30489-1.77636e-15C0.445878-1.77636e-15 0 0.445887 0 1.3049L0 14.8409C0 15.6999 0.445878 16.1458 1.30489 16.1458ZM8.39828 16.1458L10.6178 16.1458C11.4665 16.1458 11.9124 15.6999 11.9124 14.8409L11.9124 1.3049C11.9124 0.404486 11.4665-1.77636e-15 10.6178-1.77636e-15L8.39828-1.77636e-15C7.53929-1.77636e-15 7.09341 0.445887 7.09341 1.3049L7.09341 14.8409C7.09341 15.6999 7.53929 16.1458 8.39828 16.1458Z"
                              fill="currentColor" fill-opacity="0.95"/>
                    </svg>

                    <!-- Play icon (默认隐藏) -->
                    <svg class="answered-ico ico-play" viewBox="0 0 16.2891 16.416" aria-hidden="true"
                         style="display:none">
                        <path d="M1.70898 14.9805C1.70898 15.9473 2.26562 16.4062 2.92969 16.4062C3.22266 16.4062 3.52539 16.3086 3.82812 16.1523L15.2051 9.50195C16.0156 9.0332 16.2891 8.71094 16.2891 8.20312C16.2891 7.68555 16.0156 7.37305 15.2051 6.9043L3.82812 0.253906C3.52539 0.0878906 3.22266 0 2.92969 0C2.26562 0 1.70898 0.458984 1.70898 1.42578Z"
                              fill="currentColor" fill-opacity="0.95"/>
                    </svg>
                </div>
                <div class="label-pause">Pause</div>
            </div>
        </div>
    </div>

    <div class="end-mask" id="endMask" aria-hidden="true"></div>

</div>

<script>
    (()=> {
      const phoneCard = document.getElementById('phoneCard');
      const bar = document.getElementById('slideBar');
      const knob = document.getElementById('knob');
      const hintShimmer = document.getElementById('hintShimmer');
      const hintBase = document.getElementById('hintBase');
      const subText = document.getElementById('subText');

      const btnMute = document.getElementById('btnMute');
      const btnEnd = document.getElementById('btnEnd');
      const btnPause = document.getElementById('btnPause');

      let dragging = false;
      let startX = 0;
      let currentX = 0;
      let maxX = 0;
      let answered = false;

      /* ========= Call timer (NEW) ========= */
      let callSec = 0;
      let timerId = null;
      let timerPaused = false;

      const fmtTime = (s) => {
        const mm = String(Math.floor(s / 60)).padStart(2, '0');
        const ss = String(s % 60).padStart(2, '0');
        return `${mm}:${ss}`;
      };

      const renderTimer = () => {
        subText.textContent = fmtTime(callSec);
      };

      const startTimer = () => {
        stopTimer();
        callSec = 0;
        timerPaused = false;
        renderTimer();
        timerId = setInterval(() => {
          if (timerPaused || !answered) return;
          callSec += 1;
          renderTimer();
        }, 1000);
      };

      const pauseTimer = () => { timerPaused = true; };
      const resumeTimer = () => { timerPaused = false; };

      const stopTimer = () => {
        if (timerId) clearInterval(timerId);
        timerId = null;
      };

      /* ========= Ringing audio ========= */
      const RING_SRC = './ringtone.m4a';
      const FADE_IN_MS = 5000;
      const START_VOL = 0.05;
      const TARGET_VOL = 1;

      let ringAudio = new Audio(RING_SRC);
      ringAudio.loop = true;
      ringAudio.preload = 'auto';
      ringAudio.volume = START_VOL;

      let fadeRaf = null;
      let ringing = false;
      let needUnlock = false;

      function fadeInRing() {
        if (fadeRaf) cancelAnimationFrame(fadeRaf);
        const t0 = performance.now();
        const tick = (t) => {
          if (!ringing) return;
          const p = Math.min(1, (t - t0) / FADE_IN_MS);
          ringAudio.volume = START_VOL + (TARGET_VOL - START_VOL) * p;
          if (p < 1) fadeRaf = requestAnimationFrame(tick);
        };
        fadeRaf = requestAnimationFrame(tick);
      }

      async function startRinging({ muted=false } = {}) {
        if (ringing) return;
        ringing = true;
        ringAudio.currentTime = 0;
        ringAudio.muted = muted;
        ringAudio.volume = START_VOL;
        try {
          await ringAudio.play();
          fadeInRing();
        } catch (e) {
          ringing = false;
          throw e;
        }
      }

      function stopRinging() {
        ringing = false;
        if (fadeRaf) cancelAnimationFrame(fadeRaf);
        fadeRaf = null;
        ringAudio.pause();
        ringAudio.currentTime = 0;
        ringAudio.muted = true;
      }

      (async () => {
        try {
          await startRinging({ muted:false });
        } catch {
          try {
            await startRinging({ muted:true });
            needUnlock = true;
          } catch {
            needUnlock = true;
          }
        }
      })();

      function unlockSoundOnce() {
        if (!needUnlock || answered) return;
        needUnlock = false;

        if (!ringing) {
          startRinging({ muted:false }).catch(()=>{});
          return;
        }
        ringAudio.muted = false;
        fadeInRing();
      }

      /* ========= Answer audio ========= */
      const ANSWER_SRC = './answer.m4a';
      let answerAudio = null;
      let needAnswerUnlock = false;

      function hangUp(){
        stopAnswer();
        stopRinging();
        stopTimer();            // ✅ NEW: stop timer on hangup
        phoneCard.classList.add('ended');
        answered = false;       // timer interval checks this too
      }

      function ensureAnswerAudio() {
        if (!answerAudio) {
          answerAudio = new Audio(ANSWER_SRC);
          answerAudio.preload = 'auto';
          answerAudio.loop = false;
          answerAudio.muted = false;
          answerAudio.volume = 1.0;

          answerAudio.addEventListener('ended', () => {
            if (!answered) return;
            hangUp(); // ✅ ended also stops timer
          });
        }
        return answerAudio;
      }

      async function playAnswer({ muted=false } = {}) {
        const a = ensureAnswerAudio();
        a.currentTime = 0;
        a.muted = !!muted;
        try {
          await a.play();
          needAnswerUnlock = false;
        } catch {
          // autoplay 被拦：等 answered 后用户再点一次
          needAnswerUnlock = true;
        }
      }

      function stopAnswer() {
        if (!answerAudio) return;
        answerAudio.pause();
        answerAudio.currentTime = 0;
      }

      // 只在“已接听”状态下才解锁 answer
      function unlockAnswerIfNeeded() {
        if (!answered) return;
        if (!needAnswerUnlock) return;
        needAnswerUnlock = false;
        if (!answerAudio) return;
        answerAudio.muted = false;
        answerAudio.play().catch(()=>{});
      }

      if (window.PointerEvent) {
        window.addEventListener('pointerdown', unlockSoundOnce, { once:true });
        window.addEventListener('pointerdown', unlockAnswerIfNeeded);
      } else {
        window.addEventListener('touchstart', unlockSoundOnce, { once:true });
        window.addEventListener('touchstart', unlockAnswerIfNeeded);
      }

      /* ========= slider logic ========= */
      const calcMax = () => {
        const barW = bar.clientWidth;
        const knobW = knob.clientWidth;
        const pad = parseFloat(getComputedStyle(document.documentElement)
          .getPropertyValue('--pad')) || 0;
        maxX = barW - knobW - 2*pad;
      };
      calcMax();
      window.addEventListener('resize', calcMax);

      const setX = (x) => {
        currentX = Math.max(0, Math.min(maxX, x));
        knob.style.transform = `translateX(${currentX}px)`;
        bar.style.setProperty('--cx', `${currentX}px`);

        const t = maxX ? currentX / maxX : 0;
        hintShimmer.style.opacity = String(Math.max(0, 1 - t));
      };

      const onDown = (e) => {
        if (answered) return;
        dragging = true;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        startX = clientX - currentX;
        knob.setPointerCapture?.(e.pointerId);
      };

      const onMove = (e) => {
        if (!dragging || answered) return;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const x = clientX - startX;
        setX(x);
      };

      const enterAnsweredUI = () => {
        answered = true;
        phoneCard.classList.add('answered');
        setX(maxX);
        hintBase.textContent = '';
        hintShimmer.textContent = '';
        hintShimmer.style.opacity = '1';

        stopRinging();               // ✅ 只有滑到底才停铃声
        playAnswer({ muted:false }); // ✅ 只有滑到底才播放 answer

        // ✅ NEW: show timer instead of "mobile" and start counting
        startTimer();
      };

      const onUp = () => {
        if (!dragging || answered) return;
        dragging = false;

        const threshold = maxX * 0.9;
        if (currentX >= threshold) {
          enterAnsweredUI();
          return;
        }

        const from = currentX;
        const dur = 220;
        const t0 = performance.now();
        const anim = (t) => {
          const p = Math.min(1, (t - t0) / dur);
          const ease = 1 - Math.pow(1 - p, 3);
          setX(from * (1 - ease));
          if (p < 1) requestAnimationFrame(anim);
        };
        requestAnimationFrame(anim);
      };

      if (window.PointerEvent) {
        knob.addEventListener('pointerdown', onDown);
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
      } else {
        knob.addEventListener('touchstart', (e)=>{ e.preventDefault(); onDown(e); }, { passive:false });
        window.addEventListener('touchmove', (e)=>{ e.preventDefault(); onMove(e); }, { passive:false });
        window.addEventListener('touchend', onUp);
      }

      setX(0);

      /* ========= answered buttons ========= */
      let mutedByUser = false;
      let pausedByUser = false;

      const icoMute = btnMute.querySelector('.ico-mute');
      const icoSpeak = btnMute.querySelector('.ico-speak');
      const labelMute = btnMute.querySelector('.label-mute');

      const icoPause = btnPause.querySelector('.ico-pause');
      const icoPlay = btnPause.querySelector('.ico-play');
      const labelPause = btnPause.querySelector('.label-pause');

      function setMuteUI(isMuted){
        icoMute.style.display  = isMuted ? 'none'  : 'block';
        icoSpeak.style.display = isMuted ? 'block' : 'none';
        labelMute.textContent  = isMuted ? 'Speak' : 'Mute';
      }

      function setPlayUI(isPaused){
        icoPause.style.display = isPaused ? 'none' : 'block';
        icoPlay.style.display = isPaused ? 'block' : 'none';
        labelPause.textContent = isPaused ? 'Play' : 'Pause';
      }

      setMuteUI(false);
      setPlayUI(false);

      btnEnd.addEventListener('click', () => {
        if (!answered) return;
        hangUp(); // ✅ stops timer too
      });

      btnMute.addEventListener('click', () => {
        if (!answered) return;
        const a = ensureAnswerAudio();
        mutedByUser = !mutedByUser;
        a.muted = mutedByUser;
        setMuteUI(mutedByUser);
      });

      btnPause.addEventListener('click', () => {
        if (!answered) return;
        const a = ensureAnswerAudio();
        if (a.paused) {
          a.play().catch(()=>{ needAnswerUnlock = true; });
          pausedByUser = false;
          resumeTimer();   // ✅ NEW: resume timer on Play
        } else {
          a.pause();
          pausedByUser = true;
          pauseTimer();    // ✅ NEW: pause timer on Pause
        }
        setPlayUI(pausedByUser);
      });

    })();
</script>
</body>
</html>
