<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>

  <style>
    :root{
      --ui-left: 50%;
      --ui-width: 78%;
      --slider-h: 90px;

      --pad: 3px;
      --knob: calc(var(--slider-h) - var(--pad)*2);

      --radius: 52px;
      --ios-green: #20d760;
      --soft-white: rgba(255,255,255,.94);

      /* Status bar tuning */
      --sb-top: 20px;
      --sb-pad-x: 26px;
      --sb-gap: 6px;

      --sig-w: 24px;
      --sig-h: 12px;
      --sig-scale: 1;
      --sig-y: 0px;

      --wifi-w: 19px;
      --wifi-h: 12px;
      --wifi-scale: 1;
      --wifi-y: 0px;

      --bat-w: 28px;
      --bat-h: 12px;
      --bat-scale: 1;
      --bat-y: 0px;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0; min-height:100vh; display:grid; place-items:center;
      background:#111;
    }

    .phone-card{
      position: relative;
      width: min(90vw, 390px);
      aspect-ratio: 9 / 19.5;
      overflow: hidden;
      border-radius: var(--radius);
      background:#000;
    }

    .avatar{
      position:absolute; inset:0;
      width:100%; height:100%;
      object-fit: cover;
      transform: scale(1.05);
      animation: subtleZoom 10s ease-in-out infinite;
    }

    .call-ui{
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;

      position:absolute; inset:0;
      text-align:center;
      font-family:
        system-ui, -apple-system,
        "SF Pro Display", "SF Pro Text",
        "Helvetica Neue", Arial, sans-serif;
      pointer-events:none;
      color: var(--soft-white);

      background:
        radial-gradient(120% 80% at 50% 10%, rgba(0,0,0,.18), transparent 55%),
        radial-gradient(120% 90% at 50% 100%, rgba(0,0,0,.72), transparent 60%),
        linear-gradient(to bottom, rgba(0,0,0,.10), rgba(0,0,0,.38));
    }

    /* status bar */
    .status-bar{
      position:absolute;
      top: var(--sb-top); left:0; right:0;
      padding: 0 var(--sb-pad-x);
      display:flex; align-items:center; justify-content:space-between;
      font-size:17px;
      font-weight:600;
      letter-spacing:.2px;
      line-height:1.2;
      pointer-events:none;
      color: var(--soft-white);
    }

    .status-right{
      display:flex; align-items:center;
      gap: var(--sb-gap);
      color: var(--soft-white);
      opacity:1;
    }
    .status-right svg{
      display:block;
      color: currentColor;
      filter: drop-shadow(0 1px 1px rgba(0,0,0,.25));
    }

    .sb-signal{
      width: var(--sig-w);
      height: var(--sig-h);
      transform: translateY(var(--sig-y)) scale(var(--sig-scale));
      transform-origin: center;
    }
    .sb-wifi{
      width: var(--wifi-w);
      height: var(--wifi-h);
      transform: translateY(var(--wifi-y)) scale(var(--wifi-scale));
      transform-origin: center;
    }
    .sb-battery{
      width: var(--bat-w);
      height: var(--bat-h);
      transform: translateY(var(--bat-y)) scale(var(--bat-scale));
      transform-origin: center;
    }

    .name{
      margin-top:120px;
      font-size:34px;
      font-weight:400;
      letter-spacing:0.1px;
      line-height:1.08;
      animation: fadeInUp .6s ease both;
      text-shadow:
        0 1px 2px rgba(0,0,0,.15),
        0 0 8px rgba(0,0,0,.18);
    }

    .sub{
      margin-top:4px;
      font-size:22px;
      font-weight:400;
      letter-spacing:-.1px;
      line-height:1.25;
      animation: fadeInUp .8s ease both;
      color: rgba(255,255,255,0.48);
      opacity: .8;
      text-shadow:
        0 1px 2px rgba(0,0,0,.15),
        0 0 8px rgba(0,0,0,.18);
    }

    .quick-row{
      position:absolute;
      left:var(--ui-left);
      bottom:258px;
      width:var(--ui-width);
      transform:translateX(-50%);
      display:flex; justify-content:space-between;
      padding:0 22px;
      pointer-events:none;
    }

    .quick{
      display:grid;
      justify-items:center;
      gap:6px;
    }

    .quick-ico{
      width:20px; height:20px;
      color:var(--soft-white);
      opacity:1;
    }

    .quick-txt{
      font-size:15px;
      font-weight:400;
      opacity:.9;
      letter-spacing:.2px;
      line-height:1.4;
    }

    .slide-bar{
      position:absolute; left:var(--ui-left); bottom:134px;
      width:var(--ui-width); height:var(--slider-h);
      transform:translateX(-50%);
      border-radius:999px;
      display:flex; align-items:center;
      padding:var(--pad);
      overflow:hidden;

      background: rgba(255,255,255,.16);
      backdrop-filter: blur(4px) saturate(1.2);
      -webkit-backdrop-filter: blur(2px) saturate(1.2);

      pointer-events:auto;
      user-select:none;
      touch-action:none;

      box-shadow:
        0 0 0 1px rgba(255,255,255,.01) inset,
        0 0px 4px rgba(0,0,0,.05);
    }

    .knob{
      width:var(--knob); height:var(--knob);
      border-radius:50%;
      background:#fff;
      display:grid; place-items:center;

      transform: translateX(0);
      will-change: transform;
      cursor:grab;
      pointer-events:auto;

      box-shadow:
        0 1px 2px rgba(0,0,0,.18),
        0 6px 18px rgba(0,0,0,.22);

      position: relative;
      z-index: 2;
    }
    .knob:active{cursor:grabbing}

    .phone-ico{
      width:30px; height:30px;
      color:var(--ios-green);
      transform: translateY(1px);
      filter:drop-shadow(0 1px 1px rgba(0,0,0,.25));
    }

    .hint{
      position: absolute;
      inset: 0 auto 0 0;

      width: calc(100% - var(--knob) - var(--pad)*2);
      margin-left: calc(var(--knob) + var(--pad)*2);

      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;

      font-size:20px; font-weight:400;
      letter-spacing:.2px;
      line-height:1.2;
      text-transform:lowercase;
      pointer-events:none;

      color: var(--soft-white);
      text-shadow:
        0 1px 2px rgba(0,0,0,.15),
        0 0 8px rgba(0,0,0,.18);

      z-index: 1;
      transition: opacity .2s ease, width .2s ease, margin-left .2s ease;
    }

    .slide-bar.answered .hint{
      width: calc(100% - var(--knob) - var(--pad)*2);
      margin-left: 0;
      inset: 0 auto 0 0;
      opacity: 1;
    }

    .slide-bar:not(.answered) .hint{ transform: translateX(-8px); }
    .slide-bar.answered .hint{ transform: translateX(6px); }

    .slide-bar.answered{
      background: rgba(32,215,96,.22);
      backdrop-filter: blur(14px) saturate(1.2);
      -webkit-backdrop-filter: blur(14px) saturate(1.2);
    }

    @keyframes fadeInUp{
      from{opacity:0;transform:translateY(10px)}
      to{opacity:1;transform:translateY(0)}
    }
    @keyframes subtleZoom{
      0%,100%{transform:scale(1.05)}
      50%{transform:scale(1.10)}
    }
  </style>
</head>

<script>
(() => {
  const bar = document.getElementById('slideBar');
  const knob = document.getElementById('knob');
  const hint = document.getElementById('hint');

  let dragging = false;
  let startX = 0;
  let currentX = 0;
  let maxX = 0;
  let answered = false;

  const calcMax = () => {
    const barW = bar.clientWidth;
    const knobW = knob.clientWidth;
    const pad = parseFloat(getComputedStyle(bar).paddingLeft);
    maxX = barW - knobW - pad * 2;
  };
  calcMax();
  window.addEventListener('resize', calcMax);

  const setX = (x) => {
    currentX = Math.max(0, Math.min(maxX, x));
    knob.style.transform = `translateX(${currentX}px)`;
    const t = maxX ? currentX / maxX : 0;
    hint.style.opacity = String(1 - t * 1.5);
  };

  const onDown = (e) => {
    if (answered) return;
    dragging = true;
    startX = (e.touches ? e.touches[0].clientX : e.clientX) - currentX;
    knob.setPointerCapture?.(e.pointerId);
  };

  const onMove = (e) => {
    if (!dragging || answered) return;
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - startX;
    setX(x);
  };

  const onUp = () => {
    if (!dragging || answered) return;
    dragging = false;

    const threshold = maxX * 0.78;
    if (currentX >= threshold) {
      answered = true;
      setX(maxX);
      bar.classList.add('answered');
      hint.textContent = 'answered';
      hint.style.opacity = '1';
    } else {
      const from = currentX;
      const dur = 220;
      const t0 = performance.now();
      const anim = (t) => {
        const p = Math.min(1, (t - t0) / dur);
        const ease = 1 - Math.pow(1 - p, 3);
        setX(from * (1 - ease));
        if (p < 1) requestAnimationFrame(anim);
      };
      requestAnimationFrame(anim);
    }
  };

  knob.addEventListener('pointerdown', onDown);
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);

  knob.addEventListener('touchstart', onDown, { passive:false });
  window.addEventListener('touchmove', onMove, { passive:false });
  window.addEventListener('touchend', onUp);
})();
</script>
</body>
