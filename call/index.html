<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>

  <style>
    :root{
      --ui-left: 50%;
      --ui-width: 78%;
      --slider-h: 90px;

      --pad: 3px;
      --knob: calc(var(--slider-h) - var(--pad)*2);

      --radius: 52px;
      --ios-green: #20d760;
      --soft-white: rgba(255,255,255,.94);
    }

    *{ box-sizing:border-box; }
    body{
      margin:0; min-height:100vh; display:grid; place-items:center;
      background:#111;
    }

    .phone-card{
      position: relative;
      width: min(90vw, 390px);
      aspect-ratio: 9 / 19.5;
      overflow: hidden;
      border-radius: var(--radius);
      background:#000;
    }

    .avatar{
      position:absolute; inset:0;
      width:100%; height:100%;
      object-fit: cover;
      transform: scale(1.05);
      animation: subtleZoom 10s ease-in-out infinite;
    }

    .call-ui{
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;

      position:absolute; inset:0;
      text-align:center;
      font-family:
        system-ui, -apple-system,
        "SF Pro Display", "SF Pro Text",
        "Helvetica Neue", Arial, sans-serif;
      pointer-events:none;
      color: var(--soft-white);

      background:
        radial-gradient(120% 80% at 50% 10%, rgba(0,0,0,.18), transparent 55%),
        radial-gradient(120% 90% at 50% 100%, rgba(0,0,0,.72), transparent 60%),
        linear-gradient(to bottom, rgba(0,0,0,.10), rgba(0,0,0,.38));
    }

    /* status bar */
    .status-bar{
      position:absolute; top:22px; left:0; right:0;
      padding: 0 28px;
      display:flex; align-items:center; justify-content:space-between;
      font-size:16px;
      font-weight:400;
      letter-spacing:.2px;
      line-height:1.2;
      pointer-events:none;
      color: var(--soft-white);
    }
    .status-right{
      display:flex; align-items:center; gap:8px;
      font-weight:700;
    }
    .sig{
      display:flex; align-items:flex-end; gap:2px;
      height:10px;
    }
    .sig i{
      display:block; width:3px; background:#fff; opacity:.95; border-radius:2px;
    }
    .sig i:nth-child(1){height:3px; opacity:.55}
    .sig i:nth-child(2){height:5px; opacity:.7}
    .sig i:nth-child(3){height:7px; opacity:.85}
    .sig i:nth-child(4){height:9px}

    .wifi{
      width:14px; height:10px; position:relative; opacity:.95;
    }
    .wifi:before, .wifi:after{
      content:""; position:absolute; left:50%; transform:translateX(-50%);
      border:2px solid transparent; border-top-color:#fff; border-radius:50%;
    }
    .wifi:before{ width:14px; height:14px; top:-6px; opacity:.7;}
    .wifi:after{ width:8px; height:8px; top:-3px;}

    .battery{
      height:10px; width:22px; border:1.8px solid #fff; border-radius:3px; position:relative;
    }
    .battery:after{
      content:""; position:absolute; right:-3.6px; top:2px; width:2.6px; height:6px;
      background:#fff; border-radius:1px;
    }
    .battery .lvl{
      position:absolute; inset:1.2px; background:#fff; border-radius:2px; width:70%;
    }

    .name{
      margin-top:120px;
      font-size:34px;
      font-weight:400;
      letter-spacing:0.1px;
      line-height:1.08;
      animation: fadeInUp .6s ease both;
      text-shadow:
        0 1px 2px rgba(0,0,0,.15),
        0 0 8px rgba(0,0,0,.18);
    }

    .sub{
      margin-top:4px;
      font-size:22px;
      font-weight:400;
      letter-spacing:-.1px;
      line-height:1.25;
      animation: fadeInUp .8s ease both;
      color: rgba(255,255,255,0.48);
      opacity: .8;
      text-shadow:
        0 1px 2px rgba(0,0,0,.15),
        0 0 8px rgba(0,0,0,.18);
    }

    .quick-row{
      position:absolute;
      left:var(--ui-left);
      bottom:270px;
      width:var(--ui-width);
      transform:translateX(-50%);
      display:flex; justify-content:space-between;
      padding:0 6px;
      pointer-events:none;
    }
    .quick{
      display:grid; place-items:center; gap:8px;
    }
    .quick-ico{
      font-size:24px;
      line-height:1;
      background:none;
      opacity:.95;
      filter:
        blur(.15px)
        drop-shadow(0 1px 1px rgba(0,0,0,.25));
    }
    .quick-txt{
      font-size:16px; font-weight:400; opacity:.9; letter-spacing:.2px; line-height:1.2;
      text-shadow:
        0 1px 2px rgba(0,0,0,.15),
        0 0 8px rgba(0,0,0,.18);
    }

    .slide-bar{
      position:absolute; left:var(--ui-left); bottom:134px;
      width:var(--ui-width); height:var(--slider-h);
      transform:translateX(-50%);
      border-radius:999px;
      display:flex; align-items:center;
      padding:var(--pad);
      overflow:hidden;

      background: rgba(255,255,255,.16);
      backdrop-filter: blur(4px) saturate(1.2);
      -webkit-backdrop-filter: blur(2px) saturate(1.2);

      pointer-events:auto;
      user-select:none;
      touch-action:none;

      box-shadow:
        0 0 0 1px rgba(255,255,255,.01) inset,
        0 0px 4px rgba(0,0,0,.05);
    }

    .knob{
      width:var(--knob); height:var(--knob);
      border-radius:50%;
      background:#fff;
      display:grid; place-items:center;

      transform: translateX(0);
      will-change: transform;
      cursor:grab;
      pointer-events:auto;

      box-shadow:
        0 1px 2px rgba(0,0,0,.18),
        0 6px 18px rgba(0,0,0,.22);

      /* 确保 hint 在上面 */
      position: relative;
      z-index: 2;
    }
    .knob:active{cursor:grabbing}

    .phone-ico{
      font-size:22px;
      color:var(--ios-green);
      filter:
        blur(.15px)
        drop-shadow(0 1px 1px rgba(0,0,0,.25));
    }

    .hint{
      position: absolute;
      inset: 0 auto 0 0;

      /* 默认就避开旋钮区域 */
      width: calc(100% - var(--knob) - var(--pad)*2);
      margin-left: calc(var(--knob) + var(--pad)*2);

      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;

      font-size:20px; font-weight:400;
      letter-spacing:.2px;
      line-height:1.2;
      text-transform:lowercase;
      pointer-events:none;

      color: var(--soft-white);
      text-shadow:
        0 1px 2px rgba(0,0,0,.15),
        0 0 8px rgba(0,0,0,.18);

      z-index: 1;
      transition: opacity .2s ease, width .2s ease, margin-left .2s ease;
    }

    /* answered 时不需要再额外处理（保持一致就行） */
    .slide-bar.answered .hint{
      width: calc(100% - var(--knob) - var(--pad)*2);
      margin-left: 0;            /* answered 时文字回到剩余区域居中 */
      inset: 0 auto 0 0;
      opacity: 1;
    }

    /* 默认：稍微偏左一点 */
    .slide-bar:not(.answered) .hint{
      transform: translateX(-8px);   /* -6~-10px 微调 */
    }

    /* answered：稍微偏右一点 */
    .slide-bar.answered .hint{
      transform: translateX(6px);    /* 4~8px 微调 */
    }


    .slide-bar.answered{
      background: rgba(32,215,96,.22);
      backdrop-filter: blur(14px) saturate(1.2);
      -webkit-backdrop-filter: blur(14px) saturate(1.2);
    }



    @keyframes fadeInUp{
      from{opacity:0;transform:translateY(10px)}
      to{opacity:1;transform:translateY(0)}
    }
    @keyframes subtleZoom{
      0%,100%{transform:scale(1.05)}
      50%{transform:scale(1.10)}
    }
  </style>
</head>

<body>
  <div class="phone-card">
    <img class="avatar" src="./user.webp" alt=""/>

    <div class="call-ui">
      <div class="status-bar" aria-hidden="true">
        <div class="status-time">00:00</div>
        <div class="status-right">
          <div class="sig"><i></i><i></i><i></i><i></i></div>
          <div class="wifi"></div>
          <div class="battery"><div class="lvl"></div></div>
        </div>
      </div>

      <div class="name">Future You</div>
      <div class="sub">mobile</div>

      <div class="quick-row">
        <div class="quick">
          <div class="quick-ico">⏱</div>
          <div class="quick-txt">Remind Me</div>
        </div>
        <div class="quick">
          <div class="quick-ico">💬</div>
          <div class="quick-txt">Message</div>
        </div>
      </div>

      <div class="slide-bar" id="slideBar">
        <div class="knob" id="knob">
          <span class="phone-ico">📞</span>
        </div>
        <div class="hint" id="hint">slide to answer</div>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const bar = document.getElementById('slideBar');
      const knob = document.getElementById('knob');
      const hint = document.getElementById('hint');

      let dragging = false;
      let startX = 0;
      let currentX = 0;
      let maxX = 0;
      let answered = false;

      const calcMax = () => {
        const barW = bar.clientWidth;
        const knobW = knob.clientWidth;
        const pad = parseFloat(getComputedStyle(bar).paddingLeft);
        maxX = barW - knobW - pad * 2;
      };
      calcMax();
      window.addEventListener('resize', calcMax);

      const setX = (x) => {
        currentX = Math.max(0, Math.min(maxX, x));
        knob.style.transform = `translateX(${currentX}px)`;
        const t = maxX ? currentX / maxX : 0;
        hint.style.opacity = String(1 - t * 1.5);
      };

      const onDown = (e) => {
        if (answered) return;
        dragging = true;
        startX = (e.touches ? e.touches[0].clientX : e.clientX) - currentX;
        knob.setPointerCapture?.(e.pointerId);
      };

      const onMove = (e) => {
        if (!dragging || answered) return;
        const x = (e.touches ? e.touches[0].clientX : e.clientX) - startX;
        setX(x);
      };

      const onUp = () => {
        if (!dragging || answered) return;
        dragging = false;

        const threshold = maxX * 0.78;
        if (currentX >= threshold) {
          answered = true;
          setX(maxX);
          bar.classList.add('answered');
          hint.textContent = 'answered';
          hint.style.opacity = '1';
        } else {
          const from = currentX;
          const dur = 220;
          const t0 = performance.now();
          const anim = (t) => {
            const p = Math.min(1, (t - t0) / dur);
            const ease = 1 - Math.pow(1 - p, 3);
            setX(from * (1 - ease));
            if (p < 1) requestAnimationFrame(anim);
          };
          requestAnimationFrame(anim);
        }
      };

      knob.addEventListener('pointerdown', onDown);
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);

      knob.addEventListener('touchstart', onDown, { passive:false });
      window.addEventListener('touchmove', onMove, { passive:false });
      window.addEventListener('touchend', onUp);
    })();
  </script>
</body>
</html>
